[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path = 'cache_forge'
verbosity = 2
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
no_match_contract = "Skip"
ignored_warnings_from = ["lib/forge-std"]

# Profile for FFI-dependent tests - inherits everything from default
[profile.ffi-tests]
ffi = true
fs_permissions = [{ access = "read-write", path = "./swapdatas-cache/" }]
# Run each top-level call from a test as its own EVM transaction. The DYTM FFI tests bundle
# manage-pool phases (`pool.execTransaction`) and the subsequent withdrawal in a single test
# function; without isolation the per-tx `ValueManipulationCheck` (EIP-1153 transient storage)
# rejects mixed op-types on the same pool. In production these always land in separate txs.
isolate = true

[rpc_endpoints]
base = "${BASE_URL}"
optimism = "${OPTIMISM_URL}"
arbitrum = "${ARBITRUM_URL}"
polygon = "${POLYGON_URL}"
ethereum = "${ETHEREUM_URL}"
plasma = "${PLASMA_URL}"
hyperevm = "${HYPEREVM_URL}"

[lint]
lint_on_build = false
